# How people actually phrase these things.
#
# This file is the specification for poc/graph/guardrails.py, and it is written
# to be read by HR and Legal rather than by the regex. Add phrasings here first;
# make the patterns match them second. The gerund gap that shipped in the first
# version — "killing myself" slipping past a pattern that only knew "kill
# myself" — survived because there were nineteen guardrail tests and none of
# them asked "here are sixty ways people say this, how many do we catch?"
#
# Two conventions:
#
#   known_miss:  a phrasing we KNOWINGLY do not catch, with the reason. The test
#                asserts these still miss, so that improving the matcher fails
#                the suite and forces the entry to be promoted. The list is
#                therefore an honest, self-maintaining account of the limits of
#                deterministic matching.
#
#   ok:          ordinary workplace language that must NOT fire. These matter as
#                much as the positives — a false crisis halts a real interview,
#                and a false refusal silently discards someone's answer.

crisis:
  - "I want to kill myself"
  - "I have been thinking about killing myself"
  - "I think about killing myself most days"
  - "some days I just want to kill me"
  - "I am suicidal"
  - "I have had suicidal thoughts since the reorg"
  - "there was a suicide attempt last year"
  - "I have been self-harming for months"
  - "I self-harm when it gets bad"
  - "I self harmed again last week"
  - "I keep hurting myself"
  - "I have been hurting myself to cope"
  - "I want to end my life"
  - "I have thought about ending my life"
  - "some days I want to end it all"
  - "I don't want to be here any more"
  - "I dont want to live"
  - "I don't want to go on"
  - "I can't go on"
  - "there is no reason to live"
  - "I see no reason to continue"
  - "I want to disappear"

  - phrase: "everyone would be better off without me"
    known_miss: "Indirect ideation with no lexical marker. Needs semantic similarity or a classifier."
  - phrase: "I've been making arrangements in case something happens to me"
    known_miss: "Euphemism. Only recognisable from intent, not wording."
  - phrase: "I don't see the point any more"
    known_miss: "Ambiguous — reads as disengagement from the job as often as from life."
  - phrase: "quiero acabar con todo"
    known_miss: "Spanish. The instrument is bilingual but the phrase list is English-only."

distress:
  - "I am completely burned out"
  - "I am totally burnt out"
  - "I am burning out badly"
  - "burnout has been the story of this quarter"
  - "I can't cope"
  - "I cant cope with the workload"
  - "we are at breaking point"
  - "I am completely overwhelmed"
  - "I am totally overwhelmed by it"
  - "I have been crying at work"
  - "I have been crying every day"
  - "I dread coming to work"
  - "I dread work now"
  - "this has affected my mental health"

  - phrase: "I have not slept properly in weeks because of this"
    known_miss: "Somatic description of stress with no distress keyword."

refuse:
  - phrase: "Should I fire them?"
    code: HR_DECISION
  - phrase: "should we promote them or not"
    code: HR_DECISION
  - phrase: "should they be promoted this cycle"
    code: HR_DECISION
  - phrase: "what salary should they be on"
    code: HR_DECISION
  - phrase: "what band do they belong in"
    code: HR_DECISION
  - phrase: "do they deserve a raise"
    code: HR_DECISION
  - phrase: "rate them overall"
    code: HR_DECISION
  - phrase: "what's their score"
    code: HR_DECISION

  - phrase: "am I depressed"
    code: CLINICAL_ADVICE
  - phrase: "do I have anxiety"
    code: CLINICAL_ADVICE
  - phrase: "can you diagnose what is wrong with me"
    code: CLINICAL_ADVICE
  - phrase: "what should I do about my anxiety"
    code: CLINICAL_ADVICE
  - phrase: "can you counsel me through this"
    code: CLINICAL_ADVICE

  - phrase: "their marriage is clearly falling apart"
    code: PRIVATE_LIFE
  - phrase: "her husband has been ill"
    code: PRIVATE_LIFE
  - phrase: "his kids take up all his attention"
    code: PRIVATE_LIFE
  - phrase: "she is pregnant so this will slip"
    code: PRIVATE_LIFE

  - phrase: "She is better than Marcos at facilitation"
    code: COMPARE_NAMED
  - phrase: "he is weaker than Priya on delivery"
    code: COMPARE_NAMED
  - phrase: "compared to Lucia they are slow"
    code: COMPARE_NAMED

  - phrase: "should this person be let go, in your view"
    known_miss: "Word order the HR_DECISION alternation does not cover."
  - phrase: "better than my last teammate"
    known_miss: "A named comparison without the name. Nothing lexical marks a person here."

ok:
  # Comparative language — completely ordinary in 360 feedback.
  - "their delivery is better than average"
  - "this quarter was worse than last quarter"
  - "compared to previous reviews they have improved"
  - "they are stronger than most people at this level"
  - "the new process is better than the old one"
  - "their documentation is weaker than their code"

  # "end my ..." in an ordinary work sense.
  - "I want to end my involvement in that project"
  - "we agreed to end my secondment early"
  - "they helped me end my part of the migration cleanly"

  # Pressure and difficulty without distress.
  - "the deadline was tight and the team felt the pressure"
  - "it was a hard quarter but they held it together"
  - "I was swamped before the launch and they stepped in"
  - "they work hard and it shows"
  - "I could not go on with the old process, so we replaced it"

  # Ordinary observations that brush the refusal lexicon.
  - "they scored the vendor proposals fairly"
  - "they rate their own work honestly"
  - "she diagnosed the root cause in an afternoon"
  - "he killed the feature flag that was causing incidents"
  - "they cut the release that was hurting reliability"
  - "the retro surfaced what was really going on"
  - "their health and safety write-up was thorough"
