# Render Blueprint — read automatically because it sits at the repository root.
#
# Render → New → Blueprint → connect this repository, and it creates the service
# from this file, prompting for every value marked `sync: false`. See DEPLOY.md.
#
# This repository exists to feed Render. The canonical project lives in the
# client's GitLab; changes are made there and copied here to deploy.
#
# Secrets are deliberately NOT in this file. `sync: false` makes Render prompt for
# them at deploy time — the whole point of the password gate is defeated if the
# credential is committed next to the link.

services:
  - type: web
    name: conversational-360-demo
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Boot default. HR opts into live calls from the admin console when they
      # want to see real model output; a container restart drops back to stub,
      # because the toggle persists to `data/` and that disk is ephemeral. That
      # failsafe is deliberate — an unattended demo should not be spending money.
      - key: C360_LLM_MODE
        value: stub

      # The demo's own key, entered in the Render dashboard at deploy time.
      # `sync: false` keeps it out of the repo, and it never reaches the browser:
      # calls are made server-side, so HR uses the key without ever holding it.
      #
      # Use a key from a DEDICATED OpenAI project with a spending cap, not a
      # personal one — see the README, "Letting HR test against a real model".
      - key: OPENAI_API_KEY
        sync: false

      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: C360_SEED_ON_BOOT   # a cold start rebuilds the synthetic round
        value: "1"
      - key: C360_DEMO_BANNER    # say on every page that the data is invented
        value: "1"
      - key: C360_DEMO_USER
        sync: false
      - key: C360_DEMO_PASSWORD
        sync: false
