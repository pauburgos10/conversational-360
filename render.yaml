# The service's configuration, in Render Blueprint format.
#
# The demo is deployed as a manually created Web Service (see DEPLOY.md), which
# does NOT read this file — it is the written record of what that service needs.
# It also works unchanged as a Blueprint, since it sits at the repository root.
# Either way, keep it in step with the dashboard by hand.
#
# This repository exists to feed Render. The canonical project lives in the
# client's GitLab; changes are made there and copied here to deploy.
#
# Secrets are deliberately NOT in this file. `sync: false` makes Render prompt for
# them at deploy time — the whole point of the password gate is defeated if the
# credential is committed next to the link.

services:
  - type: web
    name: conversational-360-demo
    runtime: docker
    # Paid: persistent disks are not available on the free plan, and a free
    # instance sleeps when idle and restarts with an empty filesystem — which is
    # what wiped the minted links. Check Render's current plan names and prices.
    plan: starter
    healthCheckPath: /healthz

    # Everything the app writes at runtime lands under /app/data: the databases,
    # invites.json, the LLM-mode setting and — with C360_ROSTER_IN_DATA — the
    # roster. One disk, one mount, nothing left on the ephemeral filesystem.
    disk:
      name: c360-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      # Boot default. HR opts into live calls from the admin console when they
      # want to see real model output; a container restart drops back to stub,
      # because the toggle persists to `data/` and that disk is ephemeral. That
      # failsafe is deliberate — an unattended demo should not be spending money.
      - key: C360_LLM_MODE
        value: stub

      # The demo's own key, entered in the Render dashboard at deploy time.
      # `sync: false` keeps it out of the repo, and it never reaches the browser:
      # calls are made server-side, so HR uses the key without ever holding it.
      #
      # Use a key from a DEDICATED OpenAI project with a spending cap, not a
      # personal one — see the README, "Letting HR test against a real model".
      - key: OPENAI_API_KEY
        sync: false

      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: C360_SEED_ON_BOOT   # a cold start rebuilds the synthetic round
        value: "1"
      - key: C360_DEMO_BANNER    # say on every page that the data is invented
        value: "1"

      # REQUIRED with the disk above. The roster is the one file the app writes
      # outside data/; without this, a restart reverts it, and anyone added
      # through /admin drops out of the redaction list while their ballots stay
      # on the disk — so their name appears unmasked in the subject's report.
      - key: C360_ROSTER_IN_DATA
        value: "1"
      - key: C360_DEMO_USER
        sync: false
      - key: C360_DEMO_PASSWORD
        sync: false
